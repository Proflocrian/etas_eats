document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n style=\"width:24px;height:24px;border-radius:7px;background:#23507D\"><\u002Fspan><code style=\"font:500 13px ui-monospace,Menlo,monospace\">appBg<\u002Fcode><code style=\"font:600 13px ui-monospace,Menlo,monospace\">#23507D<\u002Fcode><span>Flat fallback. Full surface is treatment #1.<\u002Fspan>\n      <span style=\"width:24px;height:24px;border-radius:7px;background:#D3EFE8\"><\u002Fspan><code style=\"font:500 13px ui-monospace,Menlo,monospace\">foodEntryBg<\u002Fcode><code style=\"font:600 13px ui-monospace,Menlo,monospace\">#D3EFE8<\u002Fcode><span>Sea-glass<\u002Fspan>\n      <span style=\"width:24px;height:24px;border-radius:7px;background:#0E4A42\"><\u002Fspan><code style=\"font:500 13px ui-monospace,Menlo,monospace\">foodEntryText<\u002Fcode><code style=\"font:600 13px ui-monospace,Menlo,monospace\">#0E4A42<\u002Fcode><span>8.9:1 on bg<\u002Fspan>\n      <span style=\"width:24px;height:24px;border-radius:7px;background:#4FB3A2\"><\u002Fspan><code style=\"font:500 13px ui-monospace,Menlo,monospace\">foodEntryBorder<\u002Fcode><code style=\"font:600 13px ui-monospace,Menlo,monospace\">#4FB3A2<\u002Fcode><span>Also the food dot in lists<\u002Fspan>\n      <span style=\"width:24px;height:24px;border-radius:7px;background:#E3E1F7\"><\u002Fspan><code style=\"font:500 13px ui-monospace,Menlo,monospace\">activityEntryBg<\u002Fcode><code style=\"font:600 13px ui-monospace,Menlo,monospace\">#E3E1F7<\u002Fcode><span>Periwinkle mist<\u002Fspan>\n      <span style=\"width:24px;height:24px;border-radius:7px;background:#352F78\"><\u002Fspan><code style=\"font:500 13px ui-monospace,Menlo,monospace\">activityEntryText<\u002Fcode><code style=\"font:600 13px ui-monospace,Menlo,monospace\">#352F78<\u002Fcode><span>9.4:1 on bg<\u002Fspan>\n      <span style=\"width:24px;height:24px;border-radius:7px;background:#8E86DA\"><\u002Fspan><code style=\"font:500 13px ui-monospace,Menlo,monospace\">activityEntryBorder<\u002Fcode><code style=\"font:600 13px ui-monospace,Menlo,monospace\">#8E86DA<\u002Fcode><span><\u002Fspan>\n      <span style=\"width:24px;height:24px;border-radius:7px;background:#FBE1D3\"><\u002Fspan><code style=\"font:500 13px ui-monospace,Menlo,monospace\">symptomEntryBg<\u002Fcode><code style=\"font:600 13px ui-monospace,Menlo,monospace\">#FBE1D3<\u002Fcode><span>Apricot blush, the one warm note<\u002Fspan>\n      <span style=\"width:24px;height:24px;border-radius:7px;background:#7A3317\"><\u002Fspan><code style=\"font:500 13px ui-monospace,Menlo,monospace\">symptomEntryText<\u002Fcode><code style=\"font:600 13px ui-monospace,Menlo,monospace\">#7A3317<\u002Fcode><span>8.1:1 on bg<\u002Fspan>\n      <span style=\"width:24px;height:24px;border-radius:7px;background:#F2A684\"><\u002Fspan><code style=\"font:500 13px ui-monospace,Menlo,monospace\">symptomEntryBorder<\u002Fcode><code style=\"font:600 13px ui-monospace,Menlo,monospace\">#F2A684<\u002Fcode><span>Also symptom card titles on denim (4.6:1, 18px bold)<\u002Fspan>\n      <span style=\"width:24px;height:24px;border-radius:7px;background:#F4F7FB;border:1px solid rgba(0,0,0,.1)\"><\u002Fspan><code style=\"font:500 13px ui-monospace,Menlo,monospace\">allPillBorder<\u002Fcode><code style=\"font:600 13px ui-monospace,Menlo,monospace\">#F4F7FB<\u002Fcode><span>Near-white ring<\u002Fspan>\n      <span style=\"width:24px;height:24px;border-radius:7px;background:#F2A7B5\"><\u002Fspan><code style=\"font:500 13px ui-monospace,Menlo,monospace\">triggerPillBorder<\u002Fcode><code style=\"font:600 13px ui-monospace,Menlo,monospace\">#F2A7B5<\u002Fcode><span>Soft rose. Also the \"Yes\" fill of the Possible Trigger switch, with #4E1626 text.<\u002Fspan>\n      <span style=\"width:24px;height:24px;border-radius:7px;background:#2D5B89\"><\u002Fspan><code style=\"font:500 13px ui-monospace,Menlo,monospace\">pillBg<\u002Fcode><code style=\"font:600 13px ui-monospace,Menlo,monospace\">#2D5B89<\u002Fcode><span>On sheets, pills switch to #FFFFFF (see §7)<\u002Fspan>\n      <span style=\"width:24px;height:24px;border-radius:7px;background:#5C82AA\"><\u002Fspan><code style=\"font:500 13px ui-monospace,Menlo,monospace\">pillBorderIdle<\u002Fcode><code style=\"font:600 13px ui-monospace,Menlo,monospace\">#5C82AA<\u002Fcode><span>On sheets: #CFDCE8<\u002Fspan>\n      <span style=\"width:24px;height:24px;border-radius:7px;background:#9DB9D6\"><\u002Fspan><code style=\"font:500 13px ui-monospace,Menlo,monospace\">navFont<\u002Fcode><code style=\"font:600 13px ui-monospace,Menlo,monospace\">#9DB9D6<\u002Fcode><span>5.6:1 on navBg<\u002Fspan>\n      <span style=\"width:24px;height:24px;border-radius:7px;background:#FFFFFF;border:1px solid rgba(0,0,0,.1)\"><\u002Fspan><code style=\"font:500 13px ui-monospace,Menlo,monospace\">navSelectedFont<\u002Fcode><code style=\"font:600 13px ui-monospace,Menlo,monospace\">#FFFFFF<\u002Fcode><span>+ 22×3px 🩵 tab marker<\u002Fspan>\n      <span style=\"width:24px;height:24px;border-radius:7px;background:#1B3F64\"><\u002Fspan><code style=\"font:500 13px ui-monospace,Menlo,monospace\">navBg<\u002Fcode><code style=\"font:600 13px ui-monospace,Menlo,monospace\">#1B3F64<\u002Fcode><span>1px top rule #2F5880<\u002Fspan>\n      <span style=\"width:24px;height:24px;border-radius:7px;background:#FFFFFF;border:1px solid rgba(0,0,0,.1)\"><\u002Fspan><code style=\"font:500 13px ui-monospace,Menlo,monospace\">fabBg<\u002Fcode><code style=\"font:600 13px ui-monospace,Menlo,monospace\">#FFFFFF<\u002Fcode><span>White pearl on denim, navy \"+\" #1F4A78<\u002Fspan>\n      <span style=\"width:24px;height:24px;border-radius:7px;background:#2C5986\"><\u002Fspan><code style=\"font:500 13px ui-monospace,Menlo,monospace\">settingsButtonBg<\u002Fcode><code style=\"font:600 13px ui-monospace,Menlo,monospace\">#2C5986<\u002Fcode><span>Cards + rows; 1px border #3E6994<\u002Fspan>\n      <span style=\"width:24px;height:24px;border-radius:7px;background:#F5F8FB;border:1px solid rgba(0,0,0,.1)\"><\u002Fspan><code style=\"font:500 13px ui-monospace,Menlo,monospace\">sheetBg<\u002Fcode><code style=\"font:600 13px ui-monospace,Menlo,monospace\">#F5F8FB<\u002Fcode><span>Fallback under the wave; the frosted field panel uses it at 88%<\u002Fspan>\n      <span style=\"width:24px;height:24px;border-radius:7px;background:#16324F\"><\u002Fspan><code style=\"font:500 13px ui-monospace,Menlo,monospace\">font<\u002Fcode><span style=\"grid-column:span 2;font:600 13px ui-monospace,Menlo,monospace\">'Quicksand', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:14px;font:500 15px/1.55 'Quicksand',sans-serif;color:#2B4766\">\n    <h3 style=\"margin:0;font:700 22px/1.2 'Quicksand',sans-serif;color:#16324F\">3 · Font<\u002Fh3>\n    <p style=\"margin:0;text-wrap:pretty\"><b>Quicksand<\u002Fb> (Google Fonts, OFL). It is a geometric rounded sans with a thin, even stroke, so it matches the line-art heart and reads as gentle without looking childish. Use weights 500 for body, 600 for labels and 700 for titles and chips. Never go below 500 at 11–13px. Self-host the variable woff2 (~40KB, Latin subset) in <code>/public/fonts<\u002Fcode> and declare it with <code>@font-face<\u002Fcode> and <code>font-display: swap<\u002Fcode>, so nothing is fetched at runtime and it works offline.<\u002Fp>\n    <p style=\"margin:0;font:600 13px/1.5 ui-monospace,Menlo,monospace;background:#F5F8FB;border-radius:10px;padding:12px 14px;color:#16324F\">font: 'Quicksand', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;<\u002Fp>\n    <p style=\"margin:0;text-wrap:pretty\">On iOS, <code>ui-rounded<\u002Fcode> falls back to SF Pro Rounded, which looks close to Quicksand if the font file fails to load.<\u002Fp>\n\n    <h3 style=\"margin:22px 0 0;font:700 22px/1.2 'Quicksand',sans-serif;color:#16324F\">1 · Concept<\u002Fh3>\n    <p style=\"margin:0;text-wrap:pretty\">The theme imagines a quiet room at 11:11. Denim surfaces make it feel immersive. Ice-pale sheets and entry chips do the reading work, so small text always sits on light ground with dark ink. 🩵 #A8D8EA is used only for \"this one\": the selected tab, today, the active toggle, Save. Because it is rare, it stays special.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:14px;font:500 15px/1.55 'Quicksand',sans-serif;color:#2B4766\">\n    <h3 style=\"margin:0;font:700 22px/1.2 'Quicksand',sans-serif;color:#16324F\">4 · Treatments<\u002Fh3>\n    <p style=\"margin:0\"><b>#1 Denim surface<\u002Fb> (appBg). A vertical gradient with no pattern:<\u002Fp>\n    <pre style=\"margin:0;font:500 12.5px/1.55 ui-monospace,Menlo,monospace;background:#F5F8FB;border-radius:10px;padding:12px 14px;color:#16324F;white-space:pre-wrap\">--appBgSurface: linear-gradient(180deg,#2A5986 0%,#23507D 34%,#1F4873 100%);\n--gridLine: #44709C;  --gridHalfLine: #305C88;  --gridCol: #34618D;<\u002Fpre>\n    <p style=\"margin:0\"><b>#2 Marbled wave.<\u002Fb> One inline SVG, about 3KB, written as a CSS data-URI. It is about 34 sine-wave strokes (denim → powder → cream) plus fine white hairlines on a #E9EEF1 ground. The wave period divides the tile width (480×360), so it tiles horizontally without seams. The tile sits on an oversized child at <code>rotate(-14deg)<\u002Fcode> for the diagonal flow. No raster image is needed. The generator in this file (<code>makeWave()<\u002Fcode>) outputs the exact string; run it once and paste the result as a constant.<\u002Fp>\n    <pre style=\"margin:0;font:500 12.5px/1.55 ui-monospace,Menlo,monospace;background:#F5F8FB;border-radius:10px;padding:12px 14px;color:#16324F;white-space:pre-wrap\">.wave{position:absolute;inset:0;overflow:hidden;opacity:var(--o,1);\n  mask-image:var(--mask,none)}\n.wave::before{content:\"\";position:absolute;inset:-40%;\n  background:var(--waveSvg) 0 0/480px 360px repeat;\n  transform:rotate(-14deg);animation:ttDrift 140s linear infinite}<\u002Fpre>\n    <p style=\"margin:0\">Where it appears:<\u002Fp>\n    <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px\">\n      <li>Entry form + details sheets: full opacity as the sheet background, with a 5→35% denim scrim toward the bottom.<\u002Fli>\n      <li>Header strip: 120px tall, opacity .26, <code>mask: linear-gradient(#000,transparent)<\u002Fcode>. It sits behind the status bar and header row only, never the grid.<\u002Fli>\n      \n      <li>Settings theme card: right 150px, opacity .55, masked from the left.<\u002Fli>\n    <\u002Ful>\n    <p style=\"margin:0\"><b>#3 Heart-clock SVG.<\u002Fb> Stroke only, <code>currentColor<\u002Fcode>, <code>vector-effect:non-scaling-stroke<\u002Fcode> so the line stays thin at any size. Hour hand at 11 (−30°), minute hand at 11 min (+66°), from centre (50,50):<\u002Fp>\n    <pre style=\"margin:0;font:500 12.5px/1.55 ui-monospace,Menlo,monospace;background:#F5F8FB;border-radius:10px;padding:12px 14px;color:#16324F;white-space:pre-wrap\">&lt;svg sc-camel-view-box=\"0 0 100 96\" fill=\"none\" stroke=\"currentColor\"\n  stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"&gt;\n &lt;path vector-effect=\"non-scaling-stroke\" d=\"M50 88C20 64 6 48 6 32\n  6 18 16 8 29 8c10 0 17 6 21 14 4-8 11-14 21-14 13 0 23 10 23 24\n  0 16-14 32-44 56Z\"/&gt;\n &lt;path vector-effect=\"non-scaling-stroke\" d=\"M43 38 50 50 68 42\"/&gt;\n &lt;circle cx=\"50\" cy=\"50\" r=\"2.6\" fill=\"currentColor\" stroke=\"none\"/&gt;\n&lt;/svg&gt;<\u002Fpre>\n    <p style=\"margin:0\">It appears in four places:<\u002Fp>\n    <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px\">\n      <li>Sheets: 42px, white, pulsing, in the wave band under the grabber.<\u002Fli>\n      <li>Settings + About watermark: 260px, white at 7% opacity, bleeding off the top-right edge.<\u002Fli>\n      <li>Theme card icon: 22px.<\u002Fli>\n      <li>Calendar: a 9px 🩵 heart outline (no hands) beside the \"11:00\" label.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:14px;font:500 15px/1.55 'Quicksand',sans-serif;color:#2B4766\">\n    <h3 style=\"margin:0;font:700 22px/1.2 'Quicksand',sans-serif;color:#16324F\">5 · Per-screen notes<\u002Fh3>\n    <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;text-wrap:pretty\">\n      <li><b>Calendar.<\u002Fb> A solid gradient under the grid with no pattern. Hour lines are solid #44709C; half-hours are dashed #305C88. Today's column gets a 7% 🩵 wash, and today's date is a 🩵 disc with navy text. Chips are always light fill + dark ink + a 3px left accent. That gives the three types contrast against denim, and each type keeps its own hue (teal / violet / apricot). Time labels are #A9C3DD (4.6:1).<\u002Fli>\n      <li><b>Filter chips.<\u002Fb> Fill is pillBg. Idle border is 1.5px pillBorderIdle. Selected \"All\" gets a 2px allPillBorder plus a 3px 18% halo. Type chips use their entryBorder when selected, and the trigger chip uses triggerPillBorder. Height 38px; each chip has a 44px hit area.<\u002Fli>\n      <li><b>FAB.<\u002Fb> A 60px white pearl with a navy \"+\" and a hairline 🩵 ring. During the 11:11 minute only, it emits a soft 🩵 ripple (motion §6c). The rest of the day it is still.<\u002Fli>\n      <li><b>Sheets.<\u002Fb> The full drifting wave is the sheet background (28px top radius), with a white grabber and the pulsing heart-clock in a 66px band at the top, and a 55% denim-black scrim behind the sheet. All fields sit on one frosted ice panel (rgba(245,248,251,.88) + backdrop-filter: blur(14px)), so labels and inputs keep dark-on-light contrast wherever the wave runs underneath. Inputs are white, 14px radius, #CFDCE8 border. The Save pill is 🩵 with navy text.<\u002Fli>\n      <li><b>Switches.<\u002Fb> The track is a darker inset (#1C426A on denim, #E6EEF5 on sheets). The \"No\" thumb is near-white on denim and navy on sheets. \"Yes\" on a Possible Trigger switch is rose #F2A7B5 with #4E1626 text; any other \"Yes\" uses primaryAction.<\u002Fli>\n      <li><b>Triggers.<\u002Fb> The segmented control slides a 🩵 thumb. Cards use settingsButtonBg. Symptom titles use the apricot border colour, so \"symptom\" reads warm on every screen. A large white \"11:11\" (Quicksand 500, 44px) sits at the bottom of the background, 118px above the screen edge; content scrolls over it.<\u002Fli>\n      <li><b>Nav.<\u002Fb> Deepest denim. The selected tab gets a white label and full-opacity emoji with a 22×3px 🩵 marker at the top edge. Unselected emoji drop to 72% opacity.<\u002Fli>\n      <li><b>Settings theme card.<\u002Fb> A selected card gets a 2px 🩵 border, a 4px 16% halo and a 🩵 check disc. The 11:11 card shows its heart-clock icon and a wave fading in on the right. Its swatches are primary · food · activity · symptom · trigger.<\u002Fli>\n      <li><b>About.<\u002Fb> Same background as Settings: denim gradient + 260px heart-clock watermark at 7%.<\u002Fli>\n      <li><b>Danger Area.<\u002Fb> Card #3A2F4F with border #E07A80, title and text #FFD4D6, and the destructive button #E07A80 with #3A0F14 text. It stays clearly red-family without becoming a harsh red block.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:14px;font:500 15px/1.55 'Quicksand',sans-serif;color:#2B4766\">\n    <h3 style=\"margin:0;font:700 22px/1.2 'Quicksand',sans-serif;color:#16324F\">6 · Motion<\u002Fh3>\n    <pre style=\"margin:0;font:500 12.5px/1.6 ui-monospace,Menlo,monospace;background:#F5F8FB;border-radius:10px;padding:12px 14px;color:#16324F;white-space:pre-wrap\">/* a. wave drift: one tile per 140s, GPU-cheap */\n@keyframes ttDrift{to{background-position:-480px 0}}\n\n/* b. heart breath (sheet heart), 6s */\n@keyframes ttBeat{0%,100%{opacity:.82;filter:drop-shadow(0 0 0 #A8D8EA00)}\n  50%{opacity:1;filter:drop-shadow(0 0 10px #A8D8EAD9)}}\n.heart-hero{animation:ttBeat 6s ease-in-out infinite}\n\n/* c. FAB ripple, only while clock reads 11:11 (AM or PM) */\n@keyframes ttRing{from{transform:scale(1);opacity:.6}\n  to{transform:scale(1.5);opacity:0}}\n.fab[data-eleven]::after{content:\"\";position:absolute;inset:0;\n  border-radius:50%;border:2px solid #A8D8EA;\n  animation:ttRing 3.2s ease-out infinite}\n\n/* d. sliding thumbs (existing), re-eased */\n.thumb{transition:transform .34s cubic-bezier(.3,.8,.3,1),\n  background-color .3s}\n\n/* e. sheet enter */\n.sheet{transition:transform .42s cubic-bezier(.2,.9,.25,1)}\n\n@media (prefers-reduced-motion:reduce){\n  .wave::before,.heart-hero,.fab::after{animation:none}\n  .thumb,.sheet{transition-duration:.01s}}<\u002Fpre>\n    <p style=\"margin:0;text-wrap:pretty\">For (c), check the clock once a minute with <code>setInterval(60_000)<\u002Fcode>, aligned to the start of the minute, and set <code>data-eleven<\u002Fcode> when it is 11:11. Pause the wave whenever <code>document.hidden<\u002Fcode> is true, to save battery.<\u002Fp>\n\n    <h3 style=\"margin:22px 0 0;font:700 22px/1.2 'Quicksand',sans-serif;color:#16324F\">7 · New variables / components<\u002Fh3>\n    <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px\">\n      <li><code>primaryActionText<\u002Fcode> #12304F, the text on any 🩵 fill<\u002Fli>\n      <li><code>fabIcon<\u002Fcode> #1F4A78<\u002Fli>\n      <li><code>appBgSurface<\u002Fcode>, the gradient in treatment #1<\u002Fli>\n      <li><code>textPrimary<\u002Fcode> #F4F7FB · <code>textSecondary<\u002Fcode> #B9CEE3 · <code>textMuted<\u002Fcode> #A9C3DD<\u002Fli>\n      <li><code>sheetPanel<\u002Fcode> rgba(245,248,251,.88) + blur(14px)<\u002Fli>\n      <li><code>sheetText<\u002Fcode> #16324F · <code>sheetTextMuted<\u002Fcode> #5B7590 · <code>inputBorder<\u002Fcode> #CFDCE8<\u002Fli>\n      <li><code>cardBorder<\u002Fcode> #3E6994 · <code>gridLine<\u002Fcode>, <code>gridHalfLine<\u002Fcode>, <code>gridCol<\u002Fcode><\u002Fli>\n      <li><code>switchTrack<\u002Fcode> #1C426A / #E6EEF5 on sheets<\u002Fli>\n      <li><code>pillBgOnSheet<\u002Fcode> #FFFFFF · <code>pillBorderIdleOnSheet<\u002Fcode> #CFDCE8<\u002Fli>\n      <li><code>triggerYesText<\u002Fcode> #4E1626<\u002Fli>\n      <li><code>&lt;WaveAccent height opacity mask /&gt;<\u002Fcode>, a ~15-line component around treatment #2<\u002Fli>\n      <li><code>&lt;HeartClock size pulse /&gt;<\u002Fcode>, the SVG in treatment #3<\u002Fli>\n      <li><code>theme.decor = {heroWave, sheetWave, watermark, elevenRow}<\u002Fcode>, flags so other themes can skip all of this<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { week: true, filt: 'all', formYes: false, sw: { a: false, b: true, c: false, d: true } };\n\n  makeWave() {\n    if (this._wave) return this._wave;\n    const W = 480, H = 360, n = 34;\n    const cols = ['#1F4E86', '#2F67A3', '#5C8FC4', '#8DB4DA', '#B9D3EA', '#DCE8F2', '#F1F0EA'];\n    const line = (y0, i, amp) => {\n      let d = '';\n      for (let x = 0; x <= W; x += 12) {\n        const y = y0 + amp * Math.sin((2 * Math.PI * x) / (W / 2) + i * 0.28) + 5 * Math.sin((2 * Math.PI * x * 3) / W + i * 0.5);\n        d += (x ? 'L' : 'M') + x + ' ' + y.toFixed(1);\n      }\n      return d;\n    };\n    let p = '';\n    for (let i = 0; i < n; i++) {\n      const y0 = -20 + (i * (H + 40)) / n;\n      const band = Math.sin(i * 0.42) + 0.6 * Math.sin(i * 0.17 + 1);\n      const ci = Math.max(0, Math.min(6, Math.round(((band + 1.6) / 3.2) * 6)));\n      const w = (4 + 7 * Math.abs(Math.sin(i * 0.9))).toFixed(1);\n      const o = (0.55 + 0.4 * Math.abs(Math.cos(i * 0.6))).toFixed(2);\n      p += `<path d=\"${line(y0, i, 14)}\" stroke=\"${cols[ci]}\" stroke-width=\"${w}\" stroke-opacity=\"${o}\" fill=\"none\"/>`;\n    }\n    for (let i = 0; i < n * 2; i++) {\n      const y0 = -20 + (i * (H + 40)) / (n * 2) + 3;\n      p += `<path d=\"${line(y0, i / 2, 14)}\" stroke=\"#fff\" stroke-width=\"0.8\" stroke-opacity=\"0.35\" fill=\"none\"/>`;\n    }\n    const svg = `<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"${W}\" height=\"${H}\" viewBox=\"0 0 ${W} ${H}\"><rect width=\"${W}\" height=\"${H}\" fill=\"#E9EEF1\"/>${p}<\u002Fsvg>`;\n    this._wave = 'url(\"data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '\")';\n    return this._wave;\n  }\n\n  wave(key, { opacity = 1, mask = 'none', dur = 140 } = {}) {\n    const h = React.createElement;\n    return h('div', { key, style: { position: 'absolute', inset: 0, overflow: 'hidden', opacity, WebkitMaskImage: mask, maskImage: mask } },\n      h('div', { className: 'tt-anim', style: { position: 'absolute', inset: '-40%', backgroundImage: this.makeWave(), backgroundSize: '480px 360px', transform: 'rotate(-14deg)', animation: `ttDrift ${dur}s linear infinite` } }));\n  }\n\n  heart(size) {\n    const h = React.createElement;\n    const vs = { vectorEffect: 'non-scaling-stroke' };\n    return h('svg', { className: 'tt-anim', viewBox: '0 0 100 96', width: size, height: size * 0.96, fill: 'none', stroke: '#FFFFFF', strokeWidth: 2.2, strokeLinecap: 'round', strokeLinejoin: 'round', style: { animation: 'ttBeat 6s ease-in-out infinite' } },\n      h('path', { style: vs, d: 'M50 88C20 64 6 48 6 32 6 18 16 8 29 8c10 0 17 6 21 14 4-8 11-14 21-14 13 0 23 10 23 24 0 16-14 32-44 56Z' }),\n      h('path', { style: vs, d: 'M43 38 50 50 68 42' }),\n      h('circle', { cx: 50, cy: 50, r: 2.4, fill: '#FFFFFF', stroke: 'none' }));\n  }\n\n  sw(on, trig, dark) {\n    return {\n      x: on ? 'translateX(100%)' : 'translateX(0%)',\n      bg: on ? (trig ? '#F2A7B5' : '#A8D8EA') : (dark ? '#F4F7FB' : '#16324F'),\n      noC: on ? (dark ? '#B9CEE3' : '#5B7590') : (dark ? '#16324F' : '#FFFFFF'),\n      yesC: on ? '#4E1626' : (dark ? '#B9CEE3' : '#5B7590'),\n    };\n  }\n\n  renderVals() {\n    const s = this.state;\n    const fade = 'linear-gradient(180deg,#000 0%,rgba(0,0,0,.6) 45%,transparent 100%)';\n    const chipDefs = [\n      { id: 'all', label: 'All', sel: '#F4F7FB' },\n      { id: 'food', label: '🍴', sel: '#4FB3A2', sep: true },\n      { id: 'act', label: '💪', sel: '#8E86DA' },\n      { id: 'sym', label: '🥴', sel: '#F2A684' },\n      { id: 'trig', label: '🚩', sel: '#F2A7B5', sep: true },\n    ];\n    const chips = chipDefs.map(c => {\n      const on = s.filt === c.id;\n      return { ...c, border: on ? `2px solid ${c.sel}` : '1.5px solid #5C82AA', glow: on ? `0 0 0 3px ${c.sel}2E` : 'none', onTap: () => this.setState({ filt: c.id }) };\n    });\n    const rowDefs = [\n      { k: 'a', when: '3h before', name: 'Chocolate', dot: '#4FB3A2' },\n      { k: 'b', when: '5h before', name: 'Cocktails', dot: '#4FB3A2' },\n      { k: 'c', when: '23h before', name: 'Pottery', dot: '#8E86DA' },\n      { k: 'd', when: '1d 1h before', name: 'Pizza', dot: '#4FB3A2' },\n    ];\n    const symRows = rowDefs.map((r, i) => ({\n      ...r, ...this.sw(s.sw[r.k], true, true),\n      rule: i < 3 ? '1px solid #3E6994' : 'none',\n      onTap: () => this.setState(st => ({ sw: { ...st.sw, [r.k]: !st.sw[r.k] } })),\n    }));\n    const hours = [];\n    for (let hh = 7; hh <= 17; hh++) hours.push({ label: String(hh).padStart(2, '0') + ':00', heart: hh === 11 });\n    const h = React.createElement;\n    return {\n      \n      waveStrip: this.wave('s1', { opacity: 0.26, mask: fade }),\n      waveStrip2: this.wave('s2', { opacity: 0.26, mask: fade }),\n      waveSheetA: this.wave('sa', { dur: 160 }),\n      waveSheetB: this.wave('sb', { dur: 160 }),\n      waveCard: this.wave('card', { opacity: 0.55, mask: 'linear-gradient(90deg,transparent 0%,#000 75%)' }),\n      heartSheetA: this.heart(42), heartSheetB: this.heart(42),\n      fabRing: h('div', { className: 'tt-anim', style: { position: 'absolute', inset: 0, borderRadius: 30, border: '2px solid #A8D8EA', animation: 'ttRing 3.2s ease-out infinite' } }),\n      viewX: s.week ? 'translateX(0)' : 'translateX(56px)',\n      weekColor: s.week ? '#12304F' : '#DCE8F2',\n      dayColor: s.week ? '#DCE8F2' : '#12304F',\n      toggleView: () => this.setState({ week: !s.week }),\n      chips, symRows, hours,\n      formTrig: this.sw(s.formYes, true, false),\n      toggleFormTrig: () => this.setState({ formYes: !s.formYes }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
